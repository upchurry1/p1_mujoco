model:
  xml_path: ../unitree_robots/p1/p1.xml

simulation:
  sim_dt: 0.001
  control_dt: 0.02
  duration: 8.0
  warmup_time: 0.5
  lock_free_base: true
  base_z: 0.9
  gravity: [0.0, 0.0, -9.81]

# This file is a parameter scaffold. Fill every null before running a real
# A/B coupling validation. Convention:
#   q_ab = M * q_pr + offset
#   dq_ab = M * dq_pr
#   tau_pr = M^T * tau_ab
# where q_pr = [ankle_pitch, ankle_roll] and q_ab = [ankle_A, ankle_B].
ankles:
  left:
    pitch_joint: ankle_pitch_l_joint
    roll_joint: ankle_roll_l_joint
    pitch_actuator: ankle_pitch_l_joint
    roll_actuator: ankle_roll_l_joint
    q_pr_zero: [-0.25, 0.0]
    mapping:
      type: linear
      matrix:
        - [null, null]  # A = m11 * pitch + m12 * roll + offset_A
        - [null, null]  # B = m21 * pitch + m22 * roll + offset_B
      offset: [null, null]
    motors:
      A:
        kp: null
        kd: null
        q_limit: [null, null]
        dq_limit: null
        tau_limit: null
      B:
        kp: null
        kd: null
        q_limit: [null, null]
        dq_limit: null
        tau_limit: null
  right:
    pitch_joint: ankle_pitch_r_joint
    roll_joint: ankle_roll_r_joint
    pitch_actuator: ankle_pitch_r_joint
    roll_actuator: ankle_roll_r_joint
    q_pr_zero: [-0.25, 0.0]
    mapping:
      type: linear
      matrix:
        - [null, null]
        - [null, null]
      offset: [null, null]
    motors:
      A:
        kp: null
        kd: null
        q_limit: [null, null]
        dq_limit: null
        tau_limit: null
      B:
        kp: null
        kd: null
        q_limit: [null, null]
        dq_limit: null
        tau_limit: null

hold_joints:
  hip_roll_l_joint: {q: 0.0, kp: 187.0, kd: 3.0, tau_limit: 120.0}
  hip_pitch_l_joint: {q: -0.20, kp: 187.0, kd: 3.0, tau_limit: 120.0}
  hip_yaw_l_joint: {q: 0.0, kp: 180.0, kd: 3.0, tau_limit: 60.0}
  knee_pitch_l_joint: {q: 0.50, kp: 180.0, kd: 3.0, tau_limit: 60.0}
  hip_roll_r_joint: {q: 0.0, kp: 187.0, kd: 3.0, tau_limit: 120.0}
  hip_pitch_r_joint: {q: -0.20, kp: 187.0, kd: 3.0, tau_limit: 120.0}
  hip_yaw_r_joint: {q: 0.0, kp: 180.0, kd: 3.0, tau_limit: 60.0}
  knee_pitch_r_joint: {q: 0.50, kp: 180.0, kd: 3.0, tau_limit: 60.0}

tests:
  position_tracking:
    side: left
    axis: pitch  # pitch, roll, or both
    amplitudes: [0.03, 0.05, 0.08]
    frequencies: [0.5, 1.0, 2.0]
    dq_des_mode: zero  # zero or trajectory
    phase_offset_roll: 0.0

analysis:
  saturation_threshold: 0.98
  transient_skip: 1.0

output:
  results_dir: results_ab_ankle
  csv: ab_ankle_coupling_response.csv
