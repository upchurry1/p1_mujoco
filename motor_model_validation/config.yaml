model:
  xml_path: ../unitree_robots/p1/p1.xml

simulation:
  sim_dt: 0.001
  control_dt: 0.02
  duration: 8.0
  # This is a full P1 robot model test, not a standalone motor fixture.
  # With warmup enabled, q_sim starts from the PD/gravity equilibrium in the robot.
  warmup_time: 0.5
  # Initial pelvis/root height for the free joint. In fixed-base mode this is
  # also the suspended height used throughout the trial.
  base_z: 0.9
  # Keep true for fixed-base joint response checks. Set false, or pass --free-base,
  # when you want the floating-base/contact dynamics to affect the response.
  lock_free_base: true
  gravity: [0.0, 0.0, -9.81]
  # Other configured joints are held by MIT PD so the tested joint is still
  # coupled through the robot structure but the whole robot is not uncontrolled.
  hold_other_joints: true

joints:
  - hip_pitch_l_joint
  - knee_pitch_l_joint
  - ankle_pitch_l_joint
  - ankle_roll_l_joint
  - hip_pitch_r_joint
  - knee_pitch_r_joint
  - ankle_pitch_r_joint
  - ankle_roll_r_joint

q0:
  hip_pitch_l_joint: -0.20
  knee_pitch_l_joint: 0.50
  ankle_pitch_l_joint: -0.25
  ankle_roll_l_joint: 0.00
  hip_pitch_r_joint: -0.20
  knee_pitch_r_joint: 0.50
  ankle_pitch_r_joint: -0.25
  ankle_roll_r_joint: 0.00

# Replace these with the exact MIT gains used by the deployed policy.
mit_gains:
  hip_pitch_l_joint: {kp: 187.0, kd: 3.0}
  knee_pitch_l_joint: {kp: 180.0, kd: 3.0}
  ankle_pitch_l_joint: {kp: 180.0, kd: 3.0}
  ankle_roll_l_joint: {kp: 180.0, kd: 3.0}
  hip_pitch_r_joint: {kp: 187.0, kd: 3.0}
  knee_pitch_r_joint: {kp: 180.0, kd: 3.0}
  ankle_pitch_r_joint: {kp: 180.0, kd: 3.0}
  ankle_roll_r_joint: {kp: 180.0, kd: 3.0}

hold_gains:
  default: {kp: 80.0, kd: 2.0}
  ankle_pitch_l_joint: {kp: 40.0, kd: 1.0}
  ankle_roll_l_joint: {kp: 40.0, kd: 1.0}
  ankle_pitch_r_joint: {kp: 40.0, kd: 1.0}
  ankle_roll_r_joint: {kp: 40.0, kd: 1.0}

torque_limits:
  hip_pitch_l_joint: 120.0
  knee_pitch_l_joint: 60.0
  ankle_pitch_l_joint: 34.0
  ankle_roll_l_joint: 34.0
  hip_pitch_r_joint: 120.0
  knee_pitch_r_joint: 60.0
  ankle_pitch_r_joint: 34.0
  ankle_roll_r_joint: 34.0

tests:
  position_tracking:
    enabled: true
    amplitudes: [0.03, 0.05, 0.08]
    frequencies: [0.2, 0.5, 1.0, 2.0]
    dq_des_mode: zero  # zero or trajectory
    tau_ff: 0.0
  torque_response:
    enabled: true
    torque_amplitudes: [2.0, 5.0, 10.0]
    frequencies: [0.2, 0.5, 1.0, 2.0]

analysis:
  transient_skip: 1.0
  max_phase_lag_ms: 500.0
  saturation_threshold: 0.98
  make_plots: true
  plot_max_trials: 200
  plot_time_major_tick: 0.5
  plot_time_minor_tick: 0.1
  plot_zoom:
    enabled: true
    start: 2.0
    duration: 2.0
    major_tick: 0.1
    minor_tick: 0.02
  sim_torque_column: actuator_force
  real_torque_column: auto  # auto, tau_est, or motor_current
  motor_current_to_torque:
    default: 1.0

output:
  results_dir: results
  sim_csv: sim_motor_response.csv
  metrics_csv: motor_metrics.csv
  plot_dir: plots
